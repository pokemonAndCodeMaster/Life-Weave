[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeweave"
version = "0.1.0"
description = "LifeWeave 经纬：工作、学习与生活的 AI 工作台"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.116,<1", "psycopg[binary,pool]>=3.2,<4", "pydantic>=2.11,<3", "pyyaml>=6,<7", "uvicorn[standard]>=0.35,<1", "httpx[socks]>=0.28,<1", "tomli-w>=1.2,<2", "tomli>=2,<3; python_version < '3.11'", "mistune>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
