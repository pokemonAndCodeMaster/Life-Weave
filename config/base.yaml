app:
  name: LifeWeave · 经纬
logging:
  level: ${LIFEWEAVE_LOG_LEVEL:INFO}
database:
  default: primary
  connections:
    primary:
      driver: postgresql
      host: ${LIFEWEAVE_DB_HOST:.runtime/postgres/socket}
      port: ${LIFEWEAVE_DB_PORT:55440}
      database: ${LIFEWEAVE_DB_NAME:lifeweave}
      user: ${LIFEWEAVE_DB_USER:lifeweave}
      password: ${LIFEWEAVE_DB_PASSWORD:}
      schema: workbench
      min_size: 1
      max_size: 8
